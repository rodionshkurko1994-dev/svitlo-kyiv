name: Повний обхід адрес YASNO (частинами)

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Номер частини (01, 02, ...)"
        default: "01"
      chain:
        description: "Після завершення запустити наступну частину"
        default: "yes"
      refresh:
        description: "Обійти заново, навіть якщо результат уже є"
        default: "no"

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl-full-${{ github.event.inputs.batch }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Crawl batch ${{ github.event.inputs.batch }}
        id: crawl
        run: |
          B="${{ github.event.inputs.batch }}"
          if [ -f "data/full/groups_$B.json" ] && [ "${{ github.event.inputs.refresh }}" != "yes" ]; then echo "::notice::batch $B already done"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scripts/crawl_groups.py "data/full/batch_$B.json" "data/full/groups_$B.json" --cache=data/full/streets_cache_$B.json
      - name: Commit results
        if: steps.crawl.outputs.skip != '1'
        run: |
          B="${{ github.event.inputs.batch }}"
          git config user.name "svitlo-kyiv bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/full/groups_$B.json" "data/full/streets_cache_$B.json"
          git commit -m "Обхід адрес YASNO: частина $B" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 10; done
      - name: Recolour the map
        if: steps.crawl.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-groups.yml --ref main
      - name: Start next batch
        if: github.event.inputs.chain == 'yes' && steps.crawl.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="${{ github.event.inputs.batch }}"
          N=$(printf "%02d" $((10#$B + 1)))
          if [ -f "data/full/batch_$N.json" ]; then
            gh workflow run crawl-full.yml --ref main -f batch=$N -f chain=yes -f refresh=${{ github.event.inputs.refresh }}
            echo "::notice::started batch $N"
          else
            echo "::notice::all batches done"
          fi
