name: Перефарбувати карту за групами

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-groups
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet numpy scipy
      - name: Recolour buildings
        run: python3 tools/apply_groups.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "svitlo-kyiv bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city_v2.txt index.html
          if git commit -m "Карту перефарбовано за свіжими групами YASNO"; then
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 10; done
            gh workflow run site.yml --ref main -f force=yes
          fi
