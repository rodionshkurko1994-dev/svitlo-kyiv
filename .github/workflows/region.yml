name: Київська агломерація (будинки, дороги, адреси з OSM)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # monthly, OpenStreetMap changes slowly

permissions:
  contents: write
  actions: write

concurrency:
  group: region
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install --quiet shapely osmium
      - name: OpenStreetMap extract of Ukraine (Geofabrik) cut to the agglomeration
        run: |
          curl -fsSL -o /tmp/ua.pbf https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          osmium extract -b 29.95,50.05,31.05,50.72 --strategy=smart -o /tmp/region.pbf /tmp/ua.pbf
          rm /tmp/ua.pbf
      - name: Build region layer
        run: |
          rm -rf region && python3 tools/build_region.py /tmp/region.pbf region
          du -sh region
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A region
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Оновлено дані Київської агломерації (OpenStreetMap)"
          git pull -q --rebase && git push -q
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Publish the site
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml -f force=yes
