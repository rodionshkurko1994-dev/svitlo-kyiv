name: Пробний запит (діагностика)

on:
  workflow_dispatch:
    inputs:
      script:
        default: "scripts/probe_dtek.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 "${{ github.event.inputs.script }}"
      - name: Save results
        run: |
          git config user.name "svitlo-kyiv bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "Діагностика: результати пробного запиту" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
