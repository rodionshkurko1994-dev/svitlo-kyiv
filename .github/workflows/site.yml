name: Оновлення графіка і публікація сайту

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes. (GitHub may delay scheduled runs)
  workflow_dispatch:
    inputs:
      force:
        description: "Опублікувати сайт, навіть якщо графік не змінився"
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch YASNO schedule
        id: fetch
        continue-on-error: true
        run: |
          result=$(python3 scripts/update_schedule.py)
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Commit new schedule
        if: steps.fetch.outputs.result == 'changed'
        run: |
          git config user.name "svitlo-kyiv bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "Оновлено графік YASNO"
          git push

      - name: Prepare site
        if: steps.fetch.outputs.result == 'changed' || github.event_name == 'push' || inputs.force == 'yes'
        run: |
          mkdir -p _site
          cp index.html city_v2.txt schedule.json favicon.ico favicon-32.png favicon-192.png apple-touch-icon.png _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.result == 'changed' || github.event_name == 'push' || inputs.force == 'yes'
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.fetch.outputs.result == 'changed' || github.event_name == 'push' || inputs.force == 'yes'
